name: Build MenuMelon for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build MenuMelon (iOS)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GEODE_SDK: ${{ github.workspace }}/geode-sdk

    steps:
      - name: Checkout mod
        uses: actions/checkout@v4

      # sdk: given requires an SDK that has already been downloaded.
      - name: Checkout Geode SDK
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/geode
          ref: v4.4.0
          path: geode-sdk
          submodules: recursive

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: given
          build-config: Release

      - name: Upload Geode package
        uses: actions/upload-artifact@v4
        with:
          name: MenuMelon-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
