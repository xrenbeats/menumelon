
name: Build MenuMelon for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build MenuMelon (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MenuMelon
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: given
          build-config: Release

      - name: Upload Geode package
        uses: actions/upload-artifact@v4
        with:
          name: MenuMelon-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
